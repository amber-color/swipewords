<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>単語スワイプ</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F3F0E8">
<!-- iOSはmanifestを見ないので、ホーム画面用の指定を個別に置く -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="単語">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
  :root{
    --paper:#F3F0E8;
    --card:#FFFFFF;
    --ink:#22201B;
    --sub:#78736A;
    --line:#DFDACE;
    --up:#BC442C;      /* 未知 */
    --right:#C0871C;   /* 忘却 */
    --left:#33755F;    /* 既知 */
    --down:#2C5A88;    /* 完璧 */
    --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic Medium",Meiryo,sans-serif;
    --en:"Charter","Iowan Old Style","Georgia",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    position:fixed;inset:0;width:100%;
    background:var(--paper);color:var(--ink);font-family:var(--jp);
    overflow:hidden;-webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
  }
  #app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}

  /* ---------- screens ---------- */
  .screen{
    position:absolute;inset:0;background:var(--paper);z-index:20;
    display:flex;flex-direction:column;padding:2rem 1.4rem;overflow-y:auto;
    padding-top:calc(2rem + env(safe-area-inset-top));
    padding-bottom:calc(2rem + env(safe-area-inset-bottom));
  }
  .screen[hidden]{display:none}
  #home{align-items:center;text-align:center}
  .screen h1{font-size:1.5rem;font-weight:600;letter-spacing:.02em}
  .screen h2{font-size:.78rem;font-weight:600;letter-spacing:.16em;color:var(--sub);margin:1.6rem 0 .5rem}
  .lead{color:var(--sub);font-size:.92rem;line-height:1.9;margin-top:.6rem}
  .grow{flex:1}
  .big{font-family:var(--en);font-size:3.4rem;font-weight:600;line-height:1;letter-spacing:-.02em}
  .statRow{display:grid;grid-template-columns:repeat(5,1fr);gap:.2rem;margin-top:1.3rem;width:100%}
  .stat b{display:block;font-family:var(--en);font-size:1.6rem;font-weight:600;line-height:1;white-space:nowrap}
  .stat span{display:block;margin-top:.35rem;font-size:.66rem;color:var(--sub);letter-spacing:.04em;white-space:nowrap}

  /* ホームを表示するたび、左の数字から順にジワッと浮かび上がる */
  @keyframes riseIn{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  #home.animate .big,
  #home.animate .lead,
  #home.animate .stat,
  #home.animate .bar,
  #home.animate .heat,
  #home.animate .forecast,
  #home.animate .forecastAxis{ animation:riseIn .55s cubic-bezier(.2,.7,.3,1) both }
  #home.animate .lead{ animation-delay:.05s }
  #home.animate .stat:nth-child(1){ animation-delay:.14s }
  #home.animate .stat:nth-child(2){ animation-delay:.21s }
  #home.animate .stat:nth-child(3){ animation-delay:.28s }
  #home.animate .stat:nth-child(4){ animation-delay:.35s }
  #home.animate .stat:nth-child(5){ animation-delay:.42s }
  #home.animate .bar{ animation-delay:.50s }
  #home.animate .heat{ animation-delay:.535s }
  #home.animate .forecast{ animation-delay:.57s }
  #home.animate .forecastAxis{ animation-delay:.62s }

  button{font-family:inherit;font-size:1rem;border:0;background:none;color:inherit;cursor:pointer}
  .primary{
    background:var(--ink);color:var(--paper);border-radius:14px;
    padding:1rem 2rem;font-size:1rem;font-weight:600;letter-spacing:.06em;
    align-self:stretch;margin-top:1.2rem;
  }
  .build{font-size:.62rem;color:var(--sub);opacity:.45;margin-top:.7rem;letter-spacing:.06em}
  .ghost{
    padding:.7rem 1.3rem;font-size:.78rem;
    color:var(--sub);opacity:.65;margin-top:.7rem;
  }

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:.8rem;
    padding:.9rem 1.1rem;font-size:.82rem;color:var(--sub);
    padding-top:calc(.9rem + env(safe-area-inset-top));
  }
  header .count{font-variant-numeric:tabular-nums;letter-spacing:.08em}
  header .spacer{margin-left:auto}
  #undo{
    display:flex;align-items:center;gap:.35rem;
    border:1px solid var(--line);border-radius:10px;
    padding:.45rem .95rem;font-size:.8rem;color:var(--sub);
  }
  #undo[disabled]{opacity:.3}

  /* ---------- deck ---------- */
  #deck{position:relative;flex:1;margin:.2rem 1.1rem 0}
  .card{
    position:absolute;inset:0;background:var(--card);
    border:1px solid var(--line);border-radius:22px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:2rem 2.1rem;text-align:center;   /* 長い訳がカードの縁に寄りすぎないように */
    box-shadow:0 1px 2px rgba(34,32,27,.05);
    will-change:transform,opacity;touch-action:none;
  }
  .card .meaning{font-size:clamp(1.6rem,7vw,2.3rem);font-weight:600;line-height:1.45}
  /* 先頭カードの文字だけ、枠が着地したあとから浮かび上がらせる */
  .card.front .meaning{animation:wordIn .18s cubic-bezier(.2,.7,.3,1) .05s both}
  @keyframes wordIn{
    from{opacity:0;transform:translateY(9px)}
    to{opacity:1;transform:none}
  }
  .card .meaning.en{font-family:var(--en);font-size:clamp(1.9rem,9vw,2.9rem);letter-spacing:-.01em}

  .stamp{
    position:absolute;top:1.4rem;left:50%;transform:translateX(-50%);
    font-size:.84rem;font-weight:600;letter-spacing:.12em;
    border:2px solid currentColor;border-radius:8px;
    padding:.4rem 1.1rem;opacity:0;transition:opacity .1s linear;
  }

  /* ---------- legend ---------- */
  #legend{
    display:grid;grid-template-columns:1fr 1fr 1fr;
    gap:.3rem .5rem;padding:1rem 1.1rem 1.6rem;
    padding-bottom:calc(1.6rem + env(safe-area-inset-bottom));
    font-size:.72rem;color:var(--sub);text-align:center;
  }
  #legend div{padding:.35rem .2rem;border-radius:8px;transition:background .12s,color .12s}
  #legend .l-up{grid-column:2}
  #legend .l-left{grid-column:1;grid-row:2}
  #legend .l-right{grid-column:3;grid-row:2}
  #legend .l-down{grid-column:2;grid-row:3}
  #legend div.on{color:var(--card);font-weight:600}
  #legend .l-up.on{background:var(--down)}
  #legend .l-right.on{background:var(--left)}
  #legend .l-left.on{background:var(--right)}
  #legend .l-down.on{background:var(--up)}

  /* ---------- answer flash ---------- */
  #answer{
    position:absolute;inset:0;z-index:15;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;
    background:var(--paper);
  }
  #answer.show{display:flex}
  #answer .word,
  #answer .meaning2{
    cursor:pointer;                  /* タップで読み直せる */
    max-width:calc(100% - 4rem);     /* 訳が長くても画面端まで伸ばさない */
    padding:.15rem 0;                /* タップ範囲を少し広げる */
  }
  #answer .word{font-family:var(--en);font-size:clamp(2.2rem,11vw,3.4rem);font-weight:600;letter-spacing:-.02em}
  #answer .word.ja{font-family:var(--jp);font-size:clamp(1.7rem,8vw,2.6rem);letter-spacing:0;line-height:1.4}
  #answer .meaning2{font-size:.95rem;color:var(--sub)}
  /* 例文。タップで英文を読み直せる */
  #answer .example{
    max-width:calc(100% - 4rem);margin-top:1.3rem;text-align:center;
    display:flex;flex-direction:column;gap:.4rem;
  }
  #answer .exEn{font-family:var(--en);font-size:1.02rem;line-height:1.5;color:var(--ink);cursor:pointer}
  #answer .exEn b{font-weight:700;color:var(--hl,var(--ink))}
  #answer .exJa{font-size:.86rem;line-height:1.6;color:var(--sub);cursor:pointer}
  #answer .word.ja + .meaning2{font-family:var(--en);font-size:1.05rem}
  .answerNav{display:flex;gap:.6rem;margin-top:1rem;width:100%;padding:0 1.6rem}
  .answerNav button{flex:1;border-radius:14px;padding:.85rem 0;font-size:.92rem;font-weight:600;text-align:center}
  .answerNav .next{background:var(--ink);color:var(--paper)}
  .answerNav .back{border:1px solid var(--line);color:var(--sub)}

  /* ---------- lists ---------- */
  ul{list-style:none}
  li.row{
    display:flex;gap:.9rem;align-items:baseline;
    padding:.65rem .1rem;border-bottom:1px solid var(--line);
  }
  li.row .en{font-family:var(--en);font-size:1.05rem;font-weight:600}
  li.row .ja{font-size:.82rem;color:var(--sub);margin-left:auto;text-align:right}
  li.row .tag{
    flex:none;align-self:center;color:var(--card);
    font-size:.7rem;font-weight:600;letter-spacing:.06em;
    border-radius:7px;padding:.24rem .5rem;white-space:nowrap;
  }
  li.row .restore{border:1px solid var(--line);border-radius:8px;padding:.3rem .8rem;font-size:.74rem;color:var(--sub);margin-left:auto}
  .tally{display:flex;flex-direction:column;gap:.55rem;margin-top:1.2rem}
  .tally div{display:flex;align-items:center;gap:.7rem;font-size:.92rem}
  .tally i{width:.6rem;height:.6rem;border-radius:50%;font-style:normal}
  .tally b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
  .empty{color:var(--sub);font-size:.88rem;padding:.9rem .1rem}

  /* ---------- 内訳バー ---------- */
  .bar{display:flex;height:.9rem;border-radius:6px;overflow:hidden;background:var(--line);margin-top:1.3rem;width:100%}
  .bar span{height:100%}
  .bar span:not(:first-child){border-left:2px solid var(--paper)}

  /* ---------- 今後の出題予定 ---------- */
  /* ---------- 芝生(直近の出題数) ---------- */
  /* 予定グラフと同じ15列・同じ隙間にして、縦のラインを揃える。
     濃さは::beforeに重ねた--inkの透明度で出すので、色の定義は増やさない */
  .heat{display:flex;gap:2px;width:100%;margin-top:.55rem}
  .heat span{
    flex:1 1 0;min-width:0;aspect-ratio:1;border-radius:5px;overflow:hidden;
    position:relative;display:flex;align-items:center;justify-content:center;
    background:var(--line);color:var(--ink);
    font-size:clamp(7px,2.4vw,10px);line-height:1;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  .heat span::before{content:'';position:absolute;inset:0;background:var(--ink);opacity:var(--a,0)}
  .heat span b{position:relative;font-weight:inherit}
  .heat span.dark{color:var(--paper)}

  /* 棒は件数に比例させるので、日ごとの差を見分けられるだけの高さが要る。
     ホーム画面の高さから他の部品と余白(34px×3)を引いた残りを充てる */
  #home{container-type:size}
  .forecast{
    display:flex;align-items:flex-end;gap:2px;width:100%;margin-top:1.5rem;
    flex:none;                                            /* 画面が低い時は縮めず、ホームをスクロールさせる */
    height:56px;                                          /* cqh非対応の端末向け */
    height:clamp(56px, calc(100cqh - 546px), 160px);
  }
  /* 1日分が1本の積み上げ棒。column-reverseなので並びの先頭が一番下に来る */
  .forecast span{
    flex:1;min-height:2px;border-radius:3px 3px 0 0;overflow:hidden;
    display:flex;flex-direction:column-reverse;background:var(--line);
  }
  .forecast span i{display:block;width:100%}
  .forecastAxis{display:flex;justify-content:space-between;width:100%;margin-top:.4rem;font-size:.62rem;color:var(--sub)}

  /* ---------- 出題の向き ---------- */
  /* 2つで1つのスイッチに見せる。枠は外側だけに持たせて中は塗り分け */
  .modeToggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .modeToggle button{
    padding:.5rem 1.15rem;font-size:.78rem;letter-spacing:.04em;color:var(--sub);
    transition:background .15s linear, color .15s linear;
  }
  .modeToggle button.on{background:var(--ink);color:var(--paper)}
  .ctrlRow{display:flex;gap:.5rem;align-items:center}
  .soundBtn{
    padding:.5rem .9rem;font-size:.78rem;letter-spacing:.04em;color:var(--sub);
    border:1px solid var(--line);border-radius:10px;
    transition:background .15s linear, color .15s linear;
  }
  .soundBtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ---------- 出題数ボタン ---------- */
  .sizes{display:flex;gap:.6rem;margin-top:1.2rem;width:100%}
  .size{
    flex:1;background:var(--ink);color:var(--paper);border-radius:14px;
    padding:.9rem 0;font-size:.95rem;font-weight:600;letter-spacing:.04em;text-align:center;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="count">残り <b id="remain">0</b></span>
    <span class="spacer"></span>
    <button id="undo" type="button" disabled>← 戻る</button>
  </header>

  <div id="deck"></div>

  <div id="legend">
    <div class="l-up">↑ 完璧</div>
    <div class="l-left">← 忘却</div>
    <div class="l-right">→ 既知</div>
    <div class="l-down">↓ 未知</div>
  </div>

  <div id="answer">
    <div class="word" id="ansWord"></div>
    <div class="meaning2" id="ansMeaning"></div>
    <div class="example" id="ansExample" hidden>
      <div class="exEn" id="ansExEn"></div>
      <div class="exJa" id="ansExJa"></div>
    </div>
    <div class="answerNav">
      <button class="back" id="ansBack" type="button">← 戻る</button>
      <button class="next" id="ansNext" type="button">次へ →</button>
    </div>
  </div>

  <!-- ホーム -->
  <section class="screen" id="home">
    <p class="big" id="statTotal">0</p>
    <p class="lead">全単語</p>
    <div class="statRow" id="statRow">
      <button class="stat" type="button" data-cat="new"><b id="statNew">0</b><span>未出題</span></button>
      <button class="stat" type="button" data-cat="down"><b id="statUnknown">0</b><span>未知</span></button>
      <button class="stat" type="button" data-cat="left"><b id="statForgot">0</b><span>忘却</span></button>
      <button class="stat" type="button" data-cat="right"><b id="statKnown">0</b><span>既知</span></button>
      <button class="stat" type="button" data-cat="excluded"><b id="statPerfect">0</b><span>完璧</span></button>
    </div>
    <div class="bar" id="overviewBar"></div>
    <div class="heat" id="heat" aria-label="直近2週間の出題数"></div>
    <div class="grow"></div>
    <div class="forecast" id="forecast"></div>
    <div class="forecastAxis"><span id="forecastToday">今日</span><span>2週間後</span></div>
    <div class="grow"></div>
    <div class="ctrlRow">
      <div class="modeToggle" id="modeToggle">
        <button type="button" data-mode="ja2en">日 → 英</button>
        <button type="button" data-mode="en2ja">英 → 日</button>
      </div>
      <button class="soundBtn" id="speakToggle" type="button">音声オン</button>
    </div>
    <div class="sizes" id="sizeButtons">
      <button class="size" type="button" data-size="5">5問</button>
      <button class="size" type="button" data-size="10">10問</button>
      <button class="size" type="button" data-size="20">20問</button>
    </div>
    <div class="grow"></div>
    <button class="ghost" id="resetBtn" type="button">進捗をリセット</button>
    <p class="build">ver. 2026-10-12b</p>
  </section>

  <!-- 結果 -->
  <section class="screen" id="result" hidden>
    <h1>おつかれさま</h1>
    <div class="tally" id="tally"></div>
    <h2>この回の単語</h2>
    <ul id="sessionList"></ul>
    <div class="grow"></div>
    <button class="primary" id="backHome" type="button">ホームへ</button>
  </section>

  <!-- 単語一覧 -->
  <section class="screen" id="wordList" hidden>
    <h1 id="wordListTitle"></h1>
    <ul id="wordListItems"></ul>
    <div class="grow"></div>
    <button class="primary" id="closeWordList" type="button">戻る</button>
  </section>
</div>

/* ============ 保存 ============ */
const KEY = 'tango-swipe-v1';
const MODE_KEY = 'tango-swipe-mode';   // 出題の向き。既定は日→英
const SPEAK_KEY = 'tango-swipe-speak'; // 答えの読み上げ。既定はオン
const LOG_KEY = 'tango-swipe-log';     // 日ごとの出題数 { 'YYYY-MM-DD': { ja2en:n, en2ja:n } }
const DAY = 86400000;
// 未知・忘却は日を置かずに再出題する。既知だけ連続正解の回数ぶん間隔を延ばす
const KNOWN_STEPS = [3*DAY, 7*DAY, 14*DAY, 30*DAY, 60*DAY];
// 出題セットに入れる優先度: 未出題→未知→忘却→既知
const PRIORITY = { down:1, left:2, right:3 };
// 1セッションの配分。未知5・忘却3・既知1・未出題1 の割合で配る。
// 並び順は、枠が余った時に埋める優先順でもある
const QUOTA = [['down', 5], ['left', 3], ['right', 1], ['new', 1]];
const QUOTA_TOTAL = QUOTA.reduce((a, [, n]) => a + n, 0);
// 今日の積み残し（期限が今日まで）がこの数以上のあいだは、新しい語を出さない
const BACKLOG_LIMIT = 200;
// ホーム画面の予定グラフの「今日」と同じ数え方
function todayBacklog(){
  const end = new Date(Date.now()); end.setHours(0, 0, 0, 0);
  const limit = end.getTime() + DAY;
  let n = 0;
  for(const [en] of WORDS){
    const e = store[en];
    if(!e || e.excluded || !e.lastDir) continue;
    if(e.due < limit) n++;
  }
  return n;
}

// 割り切れない出題数は、どの分類も取りこぼさないよう配分を直接決める
const QUOTA_OVERRIDE = { 5: { down:3, left:1, right:1, new:0 } };

// 割合をsize問に割り振る。端数は大きい順に配って合計を必ずsizeに合わせる
function quotaFor(size){
  if(QUOTA_OVERRIDE[size]) return { ...QUOTA_OVERRIDE[size] };
  const want = QUOTA.map(([k, n]) => {
    const exact = size * n / QUOTA_TOTAL;
    return { k, n: Math.floor(exact), rem: exact % 1 };
  });
  let left = size - want.reduce((a, w) => a + w.n, 0);
  // 端数が並んだ時はQUOTAの並び順（未知が先）が勝つ。sortが安定なのでこれで決まる
  for(const w of want.slice().sort((a, b) => b.rem - a.rem)){
    if(left <= 0) break;
    w.n++; left--;
  }
  return Object.fromEntries(want.map(w => [w.k, w.n]));
}
// 連続正解1回目で3日、以降7/14/30日と延び、5回目以降は60日で頭打ち
function knownDelay(streak){
  return KNOWN_STEPS[Math.min(Math.max(streak, 1), KNOWN_STEPS.length) - 1];
}
// 未知・忘却は同じ日に繰り返さず、翌日の頭から出す
function nextDay(t){
  const d = new Date(t);
  d.setHours(0, 0, 0, 0);
  return d.getTime() + DAY;
}
// 次にこの単語を出す時刻。commitと起動時の照合で必ず同じ式を使う
function dueAfter(dir, at, streak){
  if(dir === 'right') return at + knownDelay(streak);
  return nextDay(at) + (dir === 'left' ? DAY : 0);   // 未知は翌日、忘却はもう1日置く
}

// 'ja2en' = 日本語を見て英単語を思い出す（既定） / 'en2ja' = 英単語を見て意味を思い出す

/* ============ 答えの読み上げ（ブラウザ内蔵のTTS） ============ */
let speakOn = (() => {
  try{ return localStorage.getItem(SPEAK_KEY) !== 'off'; }catch(e){ return true; }
})();
const canSpeak = typeof speechSynthesis !== 'undefined';
let enVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  enVoice = vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if(canSpeak){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;   // 音声リストの読み込みが遅れる端末向け
}
let speakTimer = null, unlockAt = 0;
// iOSは最初の発話がユーザー操作の中で起きないと以後ずっと無音になるので、開始時に無音で解錠する
function unlockSpeech(){
  if(!canSpeak) return;
  try{
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
    unlockAt = Date.now();
  }catch(e){}
}
function say(text, onend){
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';           // 端末が日本語設定でも英語の声で読ませる
    if(enVoice) u.voice = enVoice;
    u.rate = .95;
    if(onend){ u.onend = onend; u.onerror = onend; }
    speechSynthesis.resume();   // iOSはcancelの後に一時停止のまま止まっていることがある
    speechSynthesis.speak(u);
  }catch(e){}
}
let speakToken = 0;
// textsを順に読む。1つ読み終えたら少し間をおいて次へ進む。
// 新しく読み始めるとtokenが変わり、前の読み上げの続きは打ち切られる
function speakSeq(texts){
  if(!speakOn || !canSpeak) return;
  clearTimeout(speakTimer);
  const token = ++speakToken;
  const start = () => {
    const go = i => {
      if(token !== speakToken || i >= texts.length) return;
      let moved = false, fallback = null;
      const next = () => {
        if(moved) return;
        moved = true; clearTimeout(fallback);
        if(token === speakToken) setTimeout(() => go(i + 1), 280);
      };
      // 終了イベントが来ない端末向けの保険。次の発話は待ち行列に入るだけなので、重なって読まれはしない
      fallback = setTimeout(next, 1500 + texts[i].length * 90);
      say(texts[i], next);
    };
    go(0);
  };
  let busyNow = false;
  try{ busyNow = speechSynthesis.speaking || speechSynthesis.pending; }catch(e){}
  // 解錠用の無音をcancelで打ち消すと、iOSではその後ずっと鳴らなくなる
  if(Date.now() - unlockAt < 500) busyNow = false;
  if(!busyNow){ start(); return; }
  // iOSはcancelした直後のspeakを取りこぼすので、止めてから一拍おいて読み上げる
  try{ speechSynthesis.cancel(); }catch(e){}
  speakTimer = setTimeout(start, 180);
}
const speak = text => speakSeq([text]);
function setSpeak(on){
  speakOn = on;
  try{ localStorage.setItem(SPEAK_KEY, on ? 'on' : 'off'); }catch(e){}
  if(!on && canSpeak){ speakToken++; clearTimeout(speakTimer); try{ speechSynthesis.cancel(); }catch(e){} }
  renderSpeakToggle();
}
function renderSpeakToggle(){

/* ============ 日ごとの出題数の記録 ============ */
// 進捗とは別に持つ。進捗のリセットでは消さない（やった事実は残す）。
// 向きごとに数えるので、合算も片方だけも後から出せる
let activity = (() => {
  try{
    const v = JSON.parse(localStorage.getItem(LOG_KEY));
    return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  }catch(e){ return {}; }
})();
function dayKey(t){
  const d = new Date(t);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
// delta=+1で1問分を足し、-1で取り消す
function logActivity(day, mode, delta){
  const rec = activity[day] || (activity[day] = {});
  rec[mode] = Math.max(0, (rec[mode] || 0) + delta);
  if(!rec.ja2en && !rec.en2ja) delete activity[day];   // 0になった日は残さない
  try{ localStorage.setItem(LOG_KEY, JSON.stringify(activity)); }catch(e){}
}

function load(){
  let s;
  try{ s = JSON.parse(localStorage.getItem(storeKey())) || {}; }catch(e){ s = {}; }
  // 開発中の仕様変更で lastDir を持たない古いデータを補完する
  // （stageが進んでいれば既知、それ以外は忘却だったとみなす）
  for(const en in s){
    const e = s[en];
    if(!e.excluded && !e.lastDir){
      e.lastDir = e.stage > 0 ? 'right' : 'left';
      e.lastSwipe = e.lastSwipe || e.due || 0;
      delete e.stage;
    }
    // 出題・正解の記録がない古いデータは0から数え始める
    if(e.seen === undefined){ e.seen = 0; e.correct = 0; e.streak = 0; }
    // 期限は lastDir と lastSwipe から必ず一意に決まる。値が違えば古いルールで
    // 書かれたデータなので、今の式で計算し直す
    if(!e.excluded && e.lastDir){
      const want = dueAfter(e.lastDir, e.lastSwipe, e.streak);
      if(e.due !== want) e.due = want;
    }
  }
  return s;
}
function save(){
  try{ localStorage.setItem(storeKey(), JSON.stringify(store)); }catch(e){}
}
function entry(en){
  if(!store[en]) store[en] = { due:0, excluded:false, lastDir:null, lastSwipe:0, seen:0, correct:0, streak:0 };
  return store[en];
}
function candidateWords(){
  return WORDS.map(w => w[0]).filter(en => !store[en]?.excluded);
}
function dueWords(){
  const now = Date.now();
  return candidateWords().filter(en => {
    const e = store[en];
    return !e || e.due <= now;
  });
}
function pendingWords(){
  const now = Date.now();
  return candidateWords().filter(en => {
    const e = store[en];
    return e && e.due > now;
  });
}

/* ============ セッション状態 ============ */
let queue = [];                 // 出題待ちの英単語
let history = [];               // 戻る用スナップショット（最大10）
let counts = { up:0, right:0, left:0, down:0 };
let results = new Map();        // en -> 最後に選んだ方向
let busy = false;               // 答え表示中などの入力ロック

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = (Math.random() * (i+1)) | 0;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// 未出題は0、以降は未知→忘却→既知の順
function priority(en){
  const e = store[en];
  return e?.lastDir ? PRIORITY[e.lastDir] : 0;
}

function buildQueue(size){
  // 期限が来ている語を分類ごとに分ける
  const pools = { down:[], left:[], right:[], new:[] };
  for(const en of dueWords()){
    const e = store[en];
    // lastDirが想定外の古いデータでも取りこぼさないよう既知の側に寄せる
    pools[!e ? 'new' : (pools[e.lastDir] ? e.lastDir : 'right')].push(en);
  }
  for(const k in pools) shuffle(pools[k]);

  const want = quotaFor(size);
  // 積み残しが多いあいだは消化が先。新しい語は出さず、その枠は既知に回す
  if(todayBacklog() >= BACKLOG_LIMIT){ want.right += want.new; want.new = 0; }
  const list = [];
  for(const [k] of QUOTA) list.push(...pools[k].splice(0, want[k]));

  // 足りない分類があった分は、未知→忘却→既知→未出題 の順に余りで埋める
  for(const [k] of QUOTA){
    if(list.length >= size) break;
    list.push(...pools[k].splice(0, size - list.length));
  }
  // それでも足りなければ、まだ期限前の単語を優先度順に繰り上げる
  if(list.length < size){
    const rest = pendingWords().filter(en => !list.includes(en));
    shuffle(rest);
    rest.sort((a,b) => priority(a) - priority(b));
    list.push(...rest.slice(0, size - list.length));
  }
  shuffle(list);   // 分類ごとの固まりで出ないように、最後に混ぜる
  return list;
}

function startSession(size){
  queue = buildQueue(size);
  shuffle(queue);
  history = []; counts = { up:0, right:0, left:0, down:0 }; results = new Map();
  show('study');
  render();
}

// 今後2週間、何語が再出題になるかを日ごとに数える
// 未出題は予定が無いので含めない。期限切れは今日にまとめ、2週間より先は出さない
const FORECAST_DAYS = 15;   // 今日から2週間後まで（両端を含めて15本）
// 積み上げる順。先頭が棒の一番下
const FORECAST_STACK = ['down', 'left', 'right'];   // 未知・忘却・既知
function renderForecast(){
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Array.from({ length: FORECAST_DAYS }, () => ({ down:0, left:0, right:0, total:0 }));
  for(const [en] of WORDS){
    const e = store[en];
    if(!e || e.excluded || !e.lastDir) continue;
    const d = Math.floor((e.due - today.getTime()) / DAY);
    if(d >= FORECAST_DAYS) continue;
    const bucket = days[Math.max(d, 0)];
    if(bucket[e.lastDir] === undefined) continue;
    bucket[e.lastDir]++;
    bucket.total++;
  }
  // 全部同じ目盛りで、件数に比例した高さにする。少ない日もかさ上げしない
  // （1語でも見えなくならないよう、CSSのmin-heightだけが効く）
  const scale = Math.max(...days.map(b => b.total), 1);
  $('forecast').innerHTML = days.map((b, i) => {
    const h = b.total / scale * 100;
    // 色は内訳の数字やバーと同じものを使う
    const segs = FORECAST_STACK.map(k => b[k]
      ? `<i style="height:${b[k] / b.total * 100}%;background:${CATEGORIES[k].color}"></i>` : '').join('');
    return `<span class="${i === 0 ? 'today' : ''}" style="height:${h}%">${segs}</span>`;
  }).join('');
  $('forecastToday').textContent = days[0].total ? `今日 ${days[0].total}語` : '今日';
}

/* ============ 芝生: 直近の出題数 ============ */
// 下の予定グラフと同じ列数にする。右端が今日、左端が14日前
const HEAT_DAYS = FORECAST_DAYS;
// 件数の多寡(0〜1)から、--inkを重ねる濃さを決める。
// 0.43〜0.59は文字がどちらの色でも読みにくい(コントラスト4.5未満)ので避ける
function heatAlpha(t){
  const a = .14 + .74 * t;
  if(a > .43 && a < .59) return a < .51 ? .43 : .59;
  return a;
}
function heatLabel(n){
  return n >= 1000 ? Math.round(n / 100) / 10 + 'k' : String(n);
}
function renderHeat(){
  const base = new Date(Date.now());
  base.setHours(0, 0, 0, 0);
  const days = [];
  for(let i = HEAT_DAYS - 1; i >= 0; i--){
    const d = new Date(base);
    d.setDate(d.getDate() - i);
    const rec = activity[dayKey(d)] || {};
    // 日→英と英→日を合わせた、その日にこなした問題数
    days.push({ d, n: (rec.ja2en || 0) + (rec.en2ja || 0) });
  }
  const max = Math.max(...days.map(x => x.n), 0);
  $('heat').innerHTML = days.map(({ d, n }) => {
    const title = `${d.getMonth() + 1}/${d.getDate()}  ${n}問`;
    if(!n) return `<span title="${title}"></span>`;   // 0の日は数字を出さず、一番薄い色のまま
    const a = heatAlpha(n / max);
    return `<span class="${a >= .51 ? 'dark' : ''}" style="--a:${a.toFixed(3)}" title="${title}"><b>${heatLabel(n)}</b></span>`;
  }).join('');
}

// カードを出す時は一段後ろから始めて、山札が繰り上がったように見せる
const ENTER = [ {y:14,sc:.955,op:.7}, {y:28,sc:.91,op:.4}, {y:42,sc:.865,op:.15} ];
const RISE = { type:'spring', stiffness:620, damping:34, mass:.7 };

let cards = [];        // [{el, st, anim}]
let gesture = null;

function paint(c){
  c.el.style.transform =
    `translate3d(${c.st.x}px, ${c.st.y}px, 0) rotate(${c.st.rot}deg) scale(${c.st.sc})`;
  c.el.style.opacity = c.st.op;
}
// Motionのソルバで1プロパティずつ動かす。走行中のアニメは止めてから差し替える
function animTo(c, key, to, opts){
  if(c.anim[key]) c.anim[key].stop();
  c.anim[key] = M.animate(c.st[key], to, {
    ...opts,
    onUpdate: v => { c.st[key] = v; paint(c); }
  });
}
function stopAll(c){ for(const k in c.anim) c.anim[k] && c.anim[k].stop(); }

function render(){
  $('remain').textContent = queue.length;
  $('undo').disabled = history.length === 0 || busy;
  if(gesture){ gesture.destroy(); gesture = null; }
  cards.forEach(stopAll);
  deck.innerHTML = '';
  cards = [];
  if(queue.length === 0){ finish(); return; }

  for(let i = Math.min(2, queue.length - 1); i >= 0; i--){
    const en = queue[i];
    const el = document.createElement('div');
    el.className = i === 0 ? 'card front' : 'card';
    const showEn = quizMode === 'en2ja';
    el.innerHTML =
      `<div class="stamp"></div>` +
      `<div class="meaning${showEn ? ' en' : ''}">${showEn ? en : JA[en]}</div>`;
    deck.appendChild(el);
    const c = { el, st:{ x:0, y:ENTER[i].y, rot:0, sc:ENTER[i].sc, op:ENTER[i].op }, anim:{} };
    paint(c);
    cards[i] = c;
  }
  for(let i = 0; i < cards.length; i++){
    animTo(cards[i], 'y',  REST[i].y,  RISE);
    animTo(cards[i], 'sc', REST[i].sc, RISE);
    animTo(cards[i], 'op', REST[i].op, RISE);
  }
  attachDrag(cards[0], queue[0]);
  // 英→日は英単語が問題面なので、カードが出た時点で読み上げる
  if(quizMode === 'en2ja') speak(queue[0]);
}

/* ============ スワイプ ============ */
const TH = 90, TH_DOWN = 144;          // 確定距離。下だけ1.6倍
const FLICK = .5, FLICK_DOWN = .8;     // はじく速度 px/ms
const SPRING = { type:'spring', stiffness:520, damping:38, mass:.8 };
const FLY = { duration:.34, ease:[.2,.7,.3,1] };

function attachDrag(card, en){
  const el = card.el, stamp = el.querySelector('.stamp');
  let axis = null, rotSign = 1;

  gesture = new UseGesture.DragGesture(el, s => {
    if(busy) return;
    const [mx, my] = s.movement;

    if(s.first){
      cards.forEach(stopAll);   // せり上がり中に掴まれても指の動きが勝つように
      axis = null;
      const r = el.getBoundingClientRect();
      // カードの上半分を掴んだか下半分かで回転の向きが変わる
      rotSign = (s.xy[1] - r.top) / r.height < .5 ? 1 : -1;
    }
    // 14px動いた時点で軸を仮固定。その後は指がはっきり別方向を向いたら切り替える
    if(!axis && Math.hypot(mx, my) > 14) axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
    else if(axis === 'y' && Math.abs(mx) > Math.abs(my) * 1.3) axis = 'x';
    else if(axis === 'x' && Math.abs(my) > Math.abs(mx) * 1.3) axis = 'y';

    const off  = axis === 'y' ? my : mx;
    const dir  = axis === 'y' ? (off > 0 ? 'down' : 'up') : (off > 0 ? 'right' : 'left');
    const th   = dir === 'down' ? TH_DOWN : TH;
    const reach = axis ? clamp(Math.abs(off) / th, 0, 1) : 0;

    if(s.last){
      highlight(null);
      const vel  = axis === 'y' ? s.velocity[1] : s.velocity[0];
      const sign = axis === 'y' ? s.direction[1] : s.direction[0];
      const passed = Math.abs(off) > th ||
        (vel > (dir === 'down' ? FLICK_DOWN : FLICK) && Math.abs(off) > 24 && sign === Math.sign(off));

      if(axis && passed){ flyOut(card, dir); commit(en, dir); }
      else{
        stamp.style.opacity = 0;
        animTo(card, 'x', 0, SPRING);
        animTo(card, 'y', 0, SPRING);
        animTo(card, 'rot', 0, SPRING);
        // せり上がりの途中で掴まれていた場合、縮小と透明度もここで戻しておく
        animTo(card, 'sc', REST[0].sc, SPRING);
        animTo(card, 'op', REST[0].op, SPRING);
        springBehind();
      }
      return;
    }

    card.st.x = mx;
    card.st.y = my;
    card.st.rot = clamp(mx * .07 * rotSign, -16, 16);
    paint(card);

    stamp.textContent = LABEL[dir];
    stamp.style.color = COLOR[dir];
    stamp.style.opacity = reach > .25 ? reach : 0;
    highlight(reach > .35 ? dir : null);
    leanBehind(reach);
  }, { filterTaps:true, threshold:4 });
}

// 後ろのカードは引っぱり具合に合わせて手前へせり上がる
function leanBehind(p){
  for(let i = 1; i <= 2; i++){
    const c = cards[i]; if(!c) continue;
    const a = REST[i], b = REST[i-1];
    c.st.y  = a.y  + (b.y  - a.y)  * p;
    c.st.sc = a.sc + (b.sc - a.sc) * p;
    c.st.op = a.op + (b.op - a.op) * p;
    paint(c);
  }
}
function springBehind(){
  for(let i = 1; i <= 2; i++){
    const c = cards[i]; if(!c) continue;
    animTo(c, 'y', REST[i].y, SPRING);
    animTo(c, 'sc', REST[i].sc, SPRING);
    animTo(c, 'op', REST[i].op, SPRING);
  }
}

function highlight(dir){
  for(const k in legendEls) legendEls[k].classList.toggle('on', k === dir);
}

function flyOut(card, dir){
  const w = innerWidth, h = innerHeight;
  const far = { up:[0,-h*1.1], down:[0,h*1.1], left:[-w*1.25,0], right:[w*1.25,0] }[dir];
  animTo(card, 'x', far[0], FLY);
  animTo(card, 'y', far[1], FLY);
  animTo(card, 'rot', clamp(far[0] * .02, -24, 24), FLY);
  animTo(card, 'op', 0, { duration:.3 });
  leanBehind(1);
}

/* ============ 判定の確定 ============ */
function commit(en, dir){
  busy = true;
  $('undo').disabled = true;

  const now = Date.now();   // dueとlastSwipeは同じ時刻から導く（起動時の照合で1msのズレも出さないため）
  const day = dayKey(now);

  // 戻る用スナップショット（この操作の「直前」を保存）
  history.push({
    queue: queue.slice(),
    counts: { ...counts },
    results: [...results],
    en, data: { ...entry(en) },
    day, mode: quizMode
  });
  if(history.length > 10) history.shift();

  const e = entry(en);
  queue.shift();
  logActivity(day, quizMode, +1);

  e.lastDir = dir;
  e.lastSwipe = now;
  e.seen++;
  // 既知・完璧を正解とみなす。連続正解が切れたらstreakは0に戻す
  if(dir === 'right' || dir === 'up'){ e.correct++; e.streak++; }
  else e.streak = 0;

  if(dir === 'up'){
    e.excluded = true;
  }else{
    // 未知は翌日、忘却は2日後、既知は連続正解に応じて先送り
    e.due = dueAfter(dir, now, e.streak);
  }
  counts[dir]++;
  results.set(en, dir);
  save();

  setTimeout(() => flashAnswer(en, dir), 260);
}

/* ============ 答えの表示（次へ/戻るを押すまで進まない） ============ */
let answerWord = null;      // 答え画面でタップ再生する対象
let answerSentence = '';   // 同じく例文
const escHtml = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// 例文の中の単語を目立たせる。活用していても拾えるよう、語尾を1字落とした形で探す
function markWord(sentence, word){
  const stem = word.length > 4 ? word.slice(0, -1) : word;
  return escHtml(sentence).replace(new RegExp('\\b' + stem + '\\w*', 'i'), m => `<b>${m}</b>`);
}
function flashAnswer(en, dir){
  // 出題面の反対側を答えとして大きく出す
  answerWord = en;
  const showJa = quizMode === 'en2ja';
  $('ansWord').textContent = showJa ? JA[en] : en;
  $('ansWord').classList.toggle('ja', showJa);
  $('ansWord').style.color = COLOR[dir];
  $('ansMeaning').textContent = showJa ? en : JA[en];
  // 例文と訳
  const [exEn, exJa] = EX[en] || ['', ''];
  answerSentence = exEn;
  $('ansExample').hidden = !exEn;
  $('ansExEn').innerHTML = markWord(exEn, en);
  $('ansExJa').textContent = exJa;
  $('ansExample').style.setProperty('--hl', COLOR[dir]);
  answer.classList.add('show');
  // 読み上げるのは向きに関わらず英語の方。単語のあとに例文を続ける
  speakSeq(exEn ? [en, exEn] : [en]);
}
function closeAnswer(){
  answer.classList.remove('show');
  busy = false;
  render();
}

/* ============ 戻る ============ */
function undoLast(){
  if(!history.length) return;
  const h = history.pop();
  queue = h.queue;
  counts = h.counts;
  results = new Map(h.results);
  store[h.en] = h.data;
  save();
  if(h.day) logActivity(h.day, h.mode, -1);   // 取り消した問題は数えない
}
$('undo').onclick = () => {
  if(busy || !history.length) return;
  undoLast();
  render();
};
// iOSは表示直後の要素へのclickを取りこぼすので、指を離した時点で直接処理する
function onTap(el, fn){
  el.addEventListener('pointerup', e => { e.preventDefault(); fn(); });
}
onTap($('ansNext'), () => { closeAnswer(); });
onTap($('ansBack'), () => { undoLast(); closeAnswer(); });
// 答えの文字をタップで読み直し。どちらを押しても読むのは英単語
onTap($('ansWord'), () => { if(answerWord) speak(answerWord); });
onTap($('ansMeaning'), () => { if(answerWord) speak(answerWord); });
// 例文をタップすると英文だけを読み直す
onTap($('ansExEn'), () => { if(answerSentence) speak(answerSentence); });
onTap($('ansExJa'), () => { if(answerSentence) speak(answerSentence); });

/* ============ 結果 ============ */
function finish(){
  const rows = [
    ['down','未知','var(--up)'],
    ['left','忘却','var(--right)'],
    ['right','既知','var(--left)'],
    ['up','完璧','var(--down)']
  ];
  $('tally').innerHTML = rows.map(([k,label,c]) =>
    `<div><i style="background:${c}"></i>${label}<b>${counts[k]}</b></div>`).join('');

  // 出題した順に全部並べ、和訳の右にその回の判定を色付きで出す
  $('sessionList').innerHTML = results.size
    ? [...results].map(([en, d]) =>
        `<li class="row"><span class="en">${en}</span><span class="ja">${JA[en]}</span>` +
        `<span class="tag" style="background:${COLOR[d]}">${LABEL[d]}</span></li>`).join('')
    : '<li class="empty">ありませんでした。</li>';
  show('result');
}

/* ============ ボタン ============ */
$('modeToggle').onclick = e => {
  const b = e.target.closest('button[data-mode]');
  if(b) setMode(b.dataset.mode);
};
$('sizeButtons').onclick = e => {
  const b = e.target.closest('button[data-size]');
  if(!b) return;
  unlockSpeech();   // このタップがユーザー操作なので、ここで読み上げを解禁しておく
  const size = parseInt(b.dataset.size, 10);
  if(buildQueue(size).length) startSession(size);
};
$('speakToggle').onclick = () => { unlockSpeech(); setSpeak(!speakOn); };
$('backHome').onclick = () => show('home');

// ホーム画面に置いた時、通信がなくても開けるようにしておく
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
$('statRow').onclick = e => {
  const b = e.target.closest('button[data-cat]');
  if(!b) return;
  showWordList(b.dataset.cat);
};
$('closeWordList').onclick = () => show('home');
$('wordListItems').onclick = e => {
  const b = e.target.closest('.restore');
  if(!b) return;
  const en = b.dataset.en;
  const rec = entry(en);   // 出題・正解の記録は残したまま既知に戻す
  const now = Date.now();
  rec.due = now + knownDelay(rec.streak);
  rec.excluded = false;
  rec.lastDir = 'right';
  rec.lastSwipe = now;
  save();
  showWordList('excluded');
};
$('resetBtn').onclick = () => {
  if(!confirm('すべての進捗を消します。よろしいですか？')) return;
  store = {}; save(); renderHome();
};

renderModeToggle();
renderSpeakToggle();
show('home');
</script>
